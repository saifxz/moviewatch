name: movie-watch

# Free on public repositories. GitHub may delay scheduled runs by a few minutes
# during peak hours; that is normal for schedule triggers.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: movie-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger scan on Render
        env:
          RENDER_URL: ${{ vars.MOVIE_WATCH_URL || secrets.MOVIE_WATCH_URL }}
          API_KEY: ${{ secrets.MOVIE_WATCH_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_URL:-}" ] || [ -z "${API_KEY:-}" ]; then
            echo "Set MOVIE_WATCH_URL (repo variable) and MOVIE_WATCH_API_KEY (repo secret)." >&2
            exit 1
          fi
          url="${RENDER_URL%/}/scan"
          echo "Triggering $url"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --max-time 120 \
            -X POST \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$url"
