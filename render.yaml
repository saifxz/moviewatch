services:
  - type: web
    name: movie-watch-api
    runtime: docker
    # Separate Render-style image: Chrome + Xvfb + trigger API, both sources.
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    envVars:
      # Fill these in the Render dashboard when creating the Blueprint.
      # MOVIE_WATCH_API_KEY must match the GitHub Actions secret of the same name.
      - key: MOVIE_WATCH_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # "0" means POST /scan sends Telegram. Set to "1" for a silent test.
      - key: MOVIE_WATCH_API_DRY_RUN
        value: "0"
      - key: MOVIE_WATCH_CONFIG
        value: /app/config.render.yaml
      - key: MOVIE_WATCH_CHROME_PATH
        value: /usr/bin/google-chrome
      - key: DISPLAY
        value: ":99"
