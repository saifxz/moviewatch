[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-watch"
version = "0.1.0"
description = "Read-only watcher for new movie shows on District and BookMyShow"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "tenacity>=8.3,<10.0",
  "playwright>=1.44,<2.0",
  "tzdata>=2024.1",
]

[project.scripts]
movie-watch = "movie_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
