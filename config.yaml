# Times/dates are interpreted in `timezone`, not in Windows local time.
timezone: "Asia/Kolkata"
window_days: 4              # fallback when fixed_dates is empty
# Fixed release-week window for Dune: Part Three (releases 18 Dec 2026).
# Remove this list to return to today + next 3 days.
fixed_dates:
  - "2026-12-16"
  - "2026-12-17"
  - "2026-12-18"
  - "2026-12-19"
  - "2026-12-20"
poll_minutes: 5
poll_seconds: 0          # 5 minutes via poll_minutes; set >0 to override in seconds
dedupe_cross_platform: true
max_alerts_per_run: 20
failure_alert_threshold: 3
cloudflare_alert_cooldown_hours: 6  # urgent alert on first block, then at most once per 6h
sources:
  - district
  - bookmyshow

district_timeout_seconds: 30
bookmyshow_timeout_seconds: 60
bookmyshow_headless: false
bookmyshow_browser_path: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
bookmyshow_user_data_dir: ""

targets:
  - name: "dune-allu-cinemas"
    movie: "Dune: Part Three"
    city: "hyderabad"
    enabled: true

    theatres:
      district: "ALLU Cinemas"
      bookmyshow: "ALLU Cinemas: Kokapet"

    movie_ids:
      district: "207332"
      bookmyshow: ""

    district_slug: "dune-part-three-movie-tickets-in-hyderabad-MV207332"
    bookmyshow_url: "https://in.bookmyshow.com/movies/hyderabad/dune-part-three/ET00491771"
    bookmyshow_cinema_url: "https://in.bookmyshow.com/cinemas/hyderabad/allu-cinemas-kokapet/buytickets/ALUC"

    formats: []
    languages: []

  - name: "dune-prasad-pcx"
    movie: "Dune: Part Three"
    city: "hyderabad"
    enabled: true

    theatres:
      district: "Prasads Multiplex"
      bookmyshow: "Prasads Multiplex: Hyderabad"

    movie_ids:
      district: "207332"
      bookmyshow: ""

    district_slug: "dune-part-three-movie-tickets-in-hyderabad-MV207332"
    bookmyshow_url: "https://in.bookmyshow.com/movies/hyderabad/dune-part-three/ET00491771"
    bookmyshow_cinema_url: "https://in.bookmyshow.com/cinemas/hyderabad/prasads-multiplex-hyderabad/buytickets/PRHN"

    # PCX is a screen/format at Prasads, not a separate venue name.
    formats: ["PCX"]
    languages: []
